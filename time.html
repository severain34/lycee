function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function getActiveDay(now) {
  const jsDay = now.getDay();
  const todayIdx = (jsDay + 6) % 7;
  const currentMin = now.getHours() * 60 + now.getMinutes();

  const dayStart = toMinutes(timeSlots[0].start);
  const dayEnd   = toMinutes(timeSlots[timeSlots.length - 1].end);

  if (currentMin >= dayEnd) {
    const next = new Date(now);
    next.setDate(next.getDate() + 1);
    return { name: days[(todayIdx + 1) % 7], date: next, isTomorrow: true };
  }
  if (currentMin < dayStart) {
    return { name: days[todayIdx], date: now, isTomorrow: false };
  }
  return { name: days[todayIdx], date: now, isTomorrow: false };
}

function findActiveSlot(list, currentMin) {
  for (let i = 0; i < list.length; i++) {
    const start = toMinutes(timeSlots[i].start);
    const end   = toMinutes(timeSlots[i].end);
    if (currentMin >= start && currentMin < end) return i;
  }
  return -1;
}

  for (let i = 0; i < list.length; i++) {
    const start = toMinutes(timeSlots[i].start);
    if (currentMin < start) return i;
  }
  return -1;
}

/* Pick a quote based on the day so it changes daily (not every second) */
function quoteOfTheDay(dayName) {
  const idx = days.indexOf(dayName);
  return quotes[idx % quotes.length];
}

/* =====================================================
   5. RENDER
   ===================================================== */
const focusEl = document.getElementById("focus");

function renderDay(activeDay, now) {
  const dayName = activeDay.name;
  const dateObj = activeDay.date;
  const list = schedule[dayName];
  const currentMin = now.getHours() * 60 + now.getMinutes();

  /* Header date */
  document.getElementById("clockDate").textContent =
    dateObj.toLocaleDateString(undefined, {
      weekday: "long",
      day: "numeric",
      month: "long"
    }) + (activeDay.isTomorrow ? " • Tomorrow" : "");

  /* Find active slot (only one) */
  const activeIndex = activeDay.isTomorrow
    ? -1
    : findActiveSlot(list, currentMin);

  /* ====== CASE 1: NO ACTIVE SESSION ====== */
  if (activeIndex === -1) {
    const nextIndex = findNextActivity(list, currentMin);
    let nextHtml = "";

    if (nextIndex !== -1) {
      const a = list[nextIndex];
      nextHtml = `
        <div class="next-info">
          <div class="label">NEXT UP</div>
          <div class="next-name">${a.text}</div>
          <div class="next-time">${timeSlots[nextIndex].start} – ${timeSlots[nextIndex].end}</div>
        </div>`;
    } else {
      nextHtml = `
        <div class="next-info">
          <div class="label">ALL DONE FOR TODAY</div>
          <div class="next-name">See you tomorrow 👋</div>
        </div>`;
    }

    focusEl.innerHTML = `
      <div class="no-session">
        <div class="icon">🌙</div>
        <h2>No Active Session Today</h2>
        <p>There is no activity happening at this moment. Use this time to rest and recharge.</p>
        ${nextHtml}
      </div>`;
    return;
  }

  /* ====== CASE 2: ONE ACTIVE ACTIVITY ====== */
  const current = list[activeIndex];
  const currentSlot = timeSlots[activeIndex];
  const nextIndex = activeIndex + 1;
  const nextActivity = nextIndex < list.length ? list[nextIndex] : null;
  const nextSlot = nextIndex < timeSlots.length ? timeSlots[nextIndex] : null;

  const q = quoteOfTheDay(dayName);

  const nextBlock = nextActivity
    ? `<div class="next-card">
         <div class="head">COMING UP NEXT</div>
         <div class="next-name">${nextActivity.text}</div>
         <div class="next-time">${nextSlot.start} – ${nextSlot.end}</div>
       </div>`
    : `<div class="next-card">
         <div class="head">COMING UP NEXT</div>
         <div class="next-name">All done for today</div>
         <div class="next-time">Rest well, see you tomorrow 👋</div>
       </div>`;

  focusEl.innerHTML = `
    <div class="current-wrap">
      <div class="hero-card ${current.type}">
        <div class="label">CURRENT ACTIVITY</div>
        <div class="time">${currentSlot.start} – ${currentSlot.end}</div>
        <div class="name">${current.text}</div>
        <div class="tag">${current.type.replace("-", " ").toUpperCase()}</div>
      </div>
    </div>

    <div class="side">
      ${nextBlock}
      <div class="quote-card">
        <div class="quote">${q.text}</div>
        <div class="author">${q.author}</div>
      </div>
    </div>
  `;
}

/* =====================================================
   6. CLOCK
   ===================================================== */
function tick() {
  const now = new Date();

  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("clockTime").textContent = `${hh}:${mm}:${ss}`;

  const activeDay = getActiveDay(now);
  renderDay(activeDay, now);

  /* Progress bar */
  const currentMin = now.getHours() * 60 + now.getMinutes();
  const dayStart = toMinutes(timeSlots[0].start);
  const dayEnd   = toMinutes(timeSlots[timeSlots.length - 1].end);
  let progress = ((currentMin - dayStart) / (dayEnd - dayStart)) * 100;
  progress = Math.max(0, Math.min(100, progress));
  document.getElementById("progressFill").style.width = progress + "%";
}

/* =====================================================
   7. START
   ===================================================== */
tick();
setInterval(tick, 1000);
</script>
